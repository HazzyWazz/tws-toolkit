[package]
name = "tws2tag"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
md5 = "0.8.1"
reqwest = { version = "0.13.5", features = ["blocking", "json"] }
reqwest-leaky-bucket = "0.5.0"
reqwest-middleware = "0.5.2"
serde_json = "1.0.154"
sqlite = { version = "0.37.4", features = ["bundled"] }
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "macros"] }
e621-api = {path = "../e621-api"}
