[package]
name = "tws2pool"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
reqwest-middleware = "0.5.2"
reqwest-leaky-bucket = "0.5.0"
reqwest = { version = "0.13.5", features = ["blocking"] }
e621-api = {path = "../e621-api" }
tws2tag = { path = "../tws2tag" }
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "macros"] }
